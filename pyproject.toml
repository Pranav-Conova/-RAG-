[project]
name = "asof"
version = "0.1.0"
description = "Time-aware RAG over Indian GST law: answers 'what was the rule on date X?'"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "openai>=1.40",
  "httpx>=0.27",
  "tenacity>=8.5",
]

[project.optional-dependencies]
# Heavy parsing/OCR deps: installed only on your machine for ingestion, never on Render.
ingest = [
  "pymupdf>=1.24",
  "docling>=2.0",
  "selectolax>=0.3",
  "rapidocr-onnxruntime>=1.3",
]
ui = ["streamlit>=1.38"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
asof = "asof.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a reachable Postgres + pgvector at DATABASE_URL"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
