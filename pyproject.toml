[project]
name = "asof"
version = "0.1.0"
description = "AsOf: time-aware (point-in-time) retrieval-augmented generation (RAG) for Indian GST law, with amendment tracking, hybrid search, reranking and citation verification."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Pranav-Conova" }]
keywords = [
  "rag",
  "retrieval-augmented-generation",
  "time-aware-rag",
  "temporal-rag",
  "point-in-time",
  "legal-ai",
  "legal-tech",
  "regtech",
  "gst",
  "india",
  "cbic",
  "pgvector",
  "hybrid-search",
  "reranking",
  "llm",
  "fastapi",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Database",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "openai>=1.40",
  "httpx>=0.27",
  "tenacity>=8.5",
]

[project.optional-dependencies]
# Heavy parsing/OCR deps: installed only on your machine for ingestion, never on Render.
ingest = [
  "pymupdf>=1.24",
  "selectolax>=0.3.21",  # uses the lexbor backend
  "truststore>=0.9",  # OS trust store (taxinformation.cbic.gov.in has an incomplete chain)
  "rapidocr-onnxruntime>=1.3",
]
ui = ["streamlit>=1.38"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://github.com/Pranav-Conova/-RAG-"
Repository = "https://github.com/Pranav-Conova/-RAG-"
Documentation = "https://github.com/Pranav-Conova/-RAG-#readme"
Roadmap = "https://github.com/Pranav-Conova/-RAG-/blob/main/PLAN.md"
Issues = "https://github.com/Pranav-Conova/-RAG-/issues"

[project.scripts]
asof = "asof.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a reachable Postgres + pgvector at DATABASE_URL"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
